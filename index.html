<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>XYZ College</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#register">Register</a>
    </nav>
  </header>

  <section id="home">
    <h2>Welcome to XYZ College</h2>
    <p>Empowering students since 1995.</p>
  </section>

  <section id="about">
    <h2>About Us</h2>
    <p>XYZ College is a premier institution for higher education in science and technology.</p>
  </section>

  <section id="register">
    <h2>Student Registration</h2>
    <form id="registrationForm">
      <input type="text" id="name" placeholder="Full Name" required><br>
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="text" id="course" placeholder="Course" required><br>
      <button type="submit">Submit</button>
    </form>
    <p id="message"></p>
  </section>

  <footer>
    <p>&copy; 2025 XYZ College. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
